name: Validate Dev Environment

on:
  pull_request:
    paths:
      - dev.sh
      - .github/dev/Dockerfile
      - .devcontainer/**
      - .github/workflows/dev_environment.yaml
      - tests/test_dev_environment.py
  push:
    branches:
      - main
      - develop
      - 'stable-*'
    paths:
      - dev.sh
      - .github/dev/Dockerfile
      - .devcontainer/**
      - .github/workflows/dev_environment.yaml
      - tests/test_dev_environment.py
  workflow_dispatch:

jobs:
  validate-dev-environment:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate shared Dockerfile wiring
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import pathlib
        import re

        repo_root = pathlib.Path.cwd()
        dev_sh = (repo_root / "dev.sh").read_text()
        context_match = re.search(r'^BUILD_CONTEXT="([^"]+)"$', dev_sh, re.MULTILINE)
        image_match = re.search(r'^IMAGE_NAME="([^"]+)"$', dev_sh, re.MULTILINE)
        if context_match is None:
            raise SystemExit("dev.sh is missing BUILD_CONTEXT")
        if image_match is None:
            raise SystemExit("dev.sh is missing IMAGE_NAME")
        if context_match.group(1) != ".github/dev":
            raise SystemExit(f"dev.sh BUILD_CONTEXT changed: {context_match.group(1)}")
        if image_match.group(1) != "snapmaker-u1-dev":
            raise SystemExit(f"dev.sh IMAGE_NAME changed: {image_match.group(1)}")

        devcontainer = json.loads((repo_root / ".devcontainer/devcontainer.json").read_text())
        build = devcontainer.get("build", {})
        if build.get("context") != "../.github/dev":
            raise SystemExit(f"devcontainer build context changed: {build.get('context')}")
        if build.get("dockerfile") != "Dockerfile":
            raise SystemExit(f"devcontainer Dockerfile changed: {build.get('dockerfile')}")
        PY

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build shared development image
      uses: docker/build-push-action@v6
      with:
        context: .github/dev
        load: true
        tags: snapmaker-u1-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test build tools
      run: ./dev.sh make tools

    - name: Smoke test firmware fetch
      run: ./dev.sh make firmware
