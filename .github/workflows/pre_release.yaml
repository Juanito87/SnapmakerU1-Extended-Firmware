on:
  push:
    branches:
      - main
      - 'stable-*'
  workflow_dispatch:

jobs:
  custom-firmware-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f # v4.1.0

    - name: Build Docker image with cache
      uses: docker/build-push-action@bcafcac # v7.1.0
      with:
        context: .github/dev
        load: true
        tags: snapmaker-u1-dev:latest
        # cache-from: type=gha
        # cache-to: type=gha,mode=max

    - name: Load values vars.mk
      run: cat vars.mk >> "$GITHUB_ENV"

    - name: Restore Firmwares Cache
      id: cache-firmwares
      uses: actions/cache/restore@27d5ce7 # v5.0.5
      with:
        path: firmware/
        key: firmwares-${{ runner.os }}-${{ runner.arch }}-${{ env.FIRMWARE_VERSION }}

    - name: Restore Kernel Cache
      id: cache-kernel
      uses: actions/cache/restore@27d5ce7 # v5.0.5
      with:
        path: tmp/kernel/
        key: kernels-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

    - name: Set GIT_VERSION
      shell: bash
      run: |
        nextVer=$(./scripts/next_version.sh paxx12)
        echo "GIT_VERSION=${nextVer//v/}" | tee -a $GITHUB_ENV

    - name: Download firmware
      run: ./dev.sh make firmware

    - name: Build with Extended Fluidd firmware
      run: ./dev.sh make build PROFILE=extended OUTPUT_FILE=U1_extended_${{ env.GIT_VERSION }}_upgrade.bin

    - name: Generate Changelog
      run: make changelog >> RELEASE.md

    - name: 'Release debian files'
      uses: ncipollo/release-action@339a818 # v1.21.0
      with:
        tag: "v${{ env.GIT_VERSION }}"
        allowUpdates: false
        updateOnlyUnreleased: true
        draft: true
        bodyFile: RELEASE.md
        artifacts: "U1_*_upgrade.bin"

    - name: Save Firmwares Cache
      if: steps.cache-firmwares.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7 # v5.0.5
      with:
        path: firmware/
        key: firmwares-${{ runner.os }}-${{ runner.arch }}-${{ env.FIRMWARE_VERSION }}

    - name: Save Kernel Cache
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7 # v5.0.5
      with:
        path: tmp/kernel/
        key: kernels-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}
